<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<title>
    ScreenLink
</title>


<!-- HOME PAGE CSS -->

<link
    rel="stylesheet"
    href="style.css"
>

</head><body><div class="app">


    <!-- =============================
         HEADER
    ============================== -->

    <header class="header">


        <div class="logo">


            <div
                class="logo-icon"
            >
                S
            </div>


            <div
                class="logo-text"
            >


                <h1>
                    ScreenLink
                </h1>


                <span>
                    Connect • Share • View
                </span>


            </div>


        </div>


    </header>



    <!-- =============================
         MAIN
    ============================== -->

    <main class="main">


        <!-- WELCOME -->

        <div
            class="welcome"
        >


            <h2
                id="welcomeTitle"
            >
                Welcome to ScreenLink
            </h2>


            <p
                id="welcomeText"
            >
                Connect another Android device
                and view its shared screen.
            </p>


        </div>



        <!-- =========================
             CREATE QR
        ========================== -->

        <button
            type="button"
            class="main-button create-qr"
            id="createQR"
        >


            <span
                class="button-icon"
            >
                ▣
            </span>


            <span>


                <strong>
                    Create QR
                </strong>


                <small>
                    Generate a connection QR code
                </small>


            </span>


        </button>



        <!-- =========================
             CONNECT DEVICE
        ========================== -->

        <button
            type="button"
            class="main-button connect"
            id="connectButton"
        >


            <span
                class="button-icon"
            >
                ⛓
            </span>


            <span>


                <strong>
                    Connect Device
                </strong>


                <small>
                    Connect to another device
                </small>


            </span>


        </button>



        <!-- =========================
             SETTINGS
        ========================== -->

        <button
            type="button"
            class="main-button settings"
            id="settingsButton"
        >


            <span
                class="button-icon"
            >
                ⚙
            </span>


            <span>


                <strong>
                    Settings
                </strong>


                <small>
                    App and privacy settings
                </small>


            </span>


        </button>



        <!-- =========================
             SETTINGS STATUS
        ========================== -->

        <div
            id="settingsInfo"
            class="settings-info"
            aria-live="polite"
        >
            Settings loaded.
        </div>


    </main>



    <!-- =============================
         FOOTER
    ============================== -->

    <footer
        class="footer"
    >


        <p>
            ScreenLink
        </p>


        <span>
            Secure connection • User permission required
        </span>


    </footer>


</div>



<!-- HOME PAGE JAVASCRIPT -->

<script
    src="script.js"
></script>

</body></html>
